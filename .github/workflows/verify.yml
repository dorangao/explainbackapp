name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Node 26 / build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run scan:secrets
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm test
        env:
          EXPLAINBACK_TEST_REDIS: /usr/bin/redis-server
      - run: npm run test:unit
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser

  # SLSA-style build provenance: on every push to main, build the site and sign an
  # attestation (Sigstore, via GitHub's OIDC identity) over the archived build output.
  # Verify any download with: gh attestation verify explainback-dist.tgz --repo dorangao/explainbackapp
  # This attests the build that CI produced from the commit; the Vercel deployment is
  # built separately from the same commit and is not covered by this attestation.
  provenance:
    name: Build provenance attestation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: tar -czf explainback-dist.tgz dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: explainback-dist.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: explainback-dist-${{ github.sha }}
          path: explainback-dist.tgz
          retention-days: 30
